<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Barra de Cúmulo</title>
  <script>
    // mismo tema que Cúmulo (comparten almacenamiento)
    (function () {
      var t = null;
      try { t = localStorage.getItem("cumulo-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    html, body { background: var(--chrome); }
    .statusbar { border-top-color: var(--line-2); }
    .home { display: grid; place-items: center; width: 30px; height: 22px; margin-left: -8px; border-radius: 4px; }
    .home:hover { background: var(--hover); }
    .home .logo { width: 14px; height: 14px; }
    .barra .appbar { margin-left: 4px; }
  </style>
</head>
<body class="barra">
  <!-- barra de tareas cuando hay otra app delante: siempre visible, como la de Windows -->
  <footer class="statusbar">
    <button id="home" class="home" type="button" title="Cúmulo (o la tecla Windows para el lanzador)" aria-label="Abrir Cúmulo">
      <svg class="logo" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5v13M1.5 8h13M3.4 3.4l9.2 9.2M12.6 3.4l-9.2 9.2"/><circle cx="8" cy="8" r="1.6"/></svg>
    </button>
    <nav id="apps" class="appbar" aria-label="Ventanas abiertas"></nav>
    <div class="tray" aria-label="Estado del equipo">
      <span class="tray-seg tray-usage" title="Uso de Claude: 5 horas · semanal">
        <svg class="mini-orbit" viewBox="0 0 16 16" aria-hidden="true">
          <circle class="mo-track" cx="8" cy="8" r="6.6"/><circle class="mo-track" cx="8" cy="8" r="3.6"/>
          <circle id="moWeekly" class="mo-arc" cx="8" cy="8" r="6.6" pathLength="100"/>
          <circle id="moSession" class="mo-arc" cx="8" cy="8" r="3.6" pathLength="100"/>
        </svg>
        <span id="moText" class="num"></span>
      </span>
      <span class="tray-seg tray-bat" title="Batería">
        <svg class="bat" viewBox="0 0 20 10" aria-hidden="true"><rect class="bat-body" x=".6" y=".6" width="16.8" height="8.8" rx="1.6"/><path class="bat-cap" d="M18.6 3.4v3.2"/><rect id="batFill" class="bat-fill" x="2.2" y="2.2" width="13.6" height="5.6" rx=".6"/></svg>
        <span id="batPct" class="num">100 %</span>
        <svg id="batBolt" class="bat-bolt" viewBox="0 0 8 12" aria-label="Cargando"><path d="M4.8.8 1.2 6.6h2.6l-.7 4.6 3.7-5.9H4.2z"/></svg>
      </span>
      <span class="tray-seg tray-clock num"><span id="clockDate"></span><span id="clockTime"></span></span>
    </div>
  </footer>
  <script src="js/barra.js"></script>
</body>
</html>
