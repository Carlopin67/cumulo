<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cúmulo</title>
  <script>
    // Tema antes de pintar, para que no parpadee: preferencia guardada o la del sistema.
    (function () {
      var t = null;
      try { t = localStorage.getItem("cumulo-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Martian+Mono:wdth,wght@75..112.5,300..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <canvas id="sky"></canvas>

  <header class="brand chrome" style="--i:0">
    <h1>Cúmulo</h1>
    <p id="stats" class="mono"></p>
  </header>

  <div class="topbar chrome" style="--i:1">
    <label class="search">
      <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.4 10.4 14 14"/></svg>
      <input id="search" type="text" placeholder="Buscar sesión" autocomplete="off" spellcheck="false" aria-label="Buscar sesión">
      <span id="searchCount" class="count mono" aria-live="polite"></span>
      <kbd class="mono">/</kbd>
    </label>
    <button id="themeToggle" class="btn icon theme" aria-label="Cambiar a modo claro" title="Cambiar tema">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <mask id="moonMask"><rect width="24" height="24" fill="#fff"/><circle class="bite" cx="24" cy="4" r="7" fill="#000"/></mask>
        <circle class="orb" cx="12" cy="12" r="5" mask="url(#moonMask)"/>
        <g class="rays"><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g>
      </svg>
    </button>
    <button id="newSession" class="btn">
      <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      <span>Nueva sesión</span>
    </button>
  </div>

  <nav id="legend" class="legend chrome" style="--i:2" aria-label="Proyectos"></nav>

  <div class="zoom chrome" style="--i:3">
    <button id="zoomIn" class="btn icon" aria-label="Acercar"><svg class="ico" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
    <button id="zoomOut" class="btn icon" aria-label="Alejar"><svg class="ico" viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
    <button id="zoomFit" class="btn icon" aria-label="Ver todo"><svg class="ico" viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
  </div>

  <p id="hint" class="hint mono">Arrastra para moverte · rueda para acercar · clic en una estrella para abrirla</p>

  <aside id="panel" class="panel" aria-hidden="true" aria-labelledby="pTitle">
    <button id="panelClose" class="close" aria-label="Cerrar"><svg class="ico" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    <div class="panel-inner">
      <p id="pProject" class="eyebrow mono"></p>
      <h2 id="pTitle"></h2>
      <blockquote id="pPrompt"></blockquote>
      <dl class="meta mono">
        <div><dt>Empezada</dt><dd id="pStarted"></dd></div>
        <div><dt>Última vez</dt><dd id="pLast"></dd></div>
        <div><dt>Mensajes</dt><dd id="pMsgs"></dd></div>
        <div><dt>ID</dt><dd id="pId" class="id"></dd></div>
      </dl>
      <div class="actions">
        <button id="pResume" class="btn primary">
          <span>Reanudar sesión</span>
          <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
        </button>
        <button id="pCopy" class="btn swap-label"><span>Copiar orden</span></button>
      </div>
      <h3 class="mono">Conectada con</h3>
      <ul id="pLinks" class="links"></ul>
    </div>
  </aside>

  <!-- Sesión abierta a pantalla completa (simulada) -->
  <section id="session" class="session" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="sTitle">
    <header class="s-head">
      <button id="sBack" class="back">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3M7 4 3 8l4 4"/></svg>
        <span>Cúmulo</span>
        <kbd class="mono">Esc</kbd>
      </button>
      <div class="s-tools">
        <span id="sId" class="mono s-idchip"></span>
        <button id="sCopy" class="btn swap-label"><span>Copiar orden</span></button>
      </div>
    </header>
    <div id="sScroll" class="s-scroll">
      <div class="s-col">
        <p id="sProject" class="eyebrow mono s-reveal" style="--i:0"></p>
        <h2 id="sTitle" class="s-reveal" style="--i:1"></h2>
        <p id="sMeta" class="mono s-meta s-reveal" style="--i:2"></p>
        <pre id="sLog" class="mono s-log s-reveal" style="--i:3"></pre>
      </div>
    </div>
    <form id="sForm" class="s-input s-reveal" style="--i:4" autocomplete="off">
      <span class="p mono" aria-hidden="true">›</span>
      <input id="sInput" class="mono" type="text" placeholder="Escribe a Claude…" aria-label="Mensaje para Claude" spellcheck="false">
      <kbd class="mono">↵</kbd>
    </form>
  </section>

  <script src="data/sessions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
